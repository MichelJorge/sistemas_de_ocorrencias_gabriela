<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ocorrências Escolares</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --pedagogica: #2563eb;
            --disciplinar: #ea580c;
            --cinza: #f3f4f6;
            --escuro: #1f2937;
            --borda: #d1d5db;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f9fafb; color: var(--escuro); padding: 20px; max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--escuro); margin-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--borda); }
        .tab { padding: 12px 24px; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: 600; }
        .tab.active { background: white; border: 2px solid var(--borda); border-bottom: 0; margin-bottom: -2px; }
        .form-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .tipo-botoes { display: flex; gap: 15px; margin-bottom: 20px; }
        .tipo-btn { flex: 1; padding: 14px; border: 3px solid; border-radius: 10px; background: white; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.2s; }
        .tipo-btn.pedagogica { border-color: var(--pedagogica); color: var(--pedagogica); }
        .tipo-btn.pedagogica.active { background: var(--pedagogica); color: white; }
        .tipo-btn.disciplinar { border-color: var(--disciplinar); color: var(--disciplinar); }
        .tipo-btn.disciplinar.active { background: var(--disciplinar); color: white; }
        .grupo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid var(--borda); border-radius: 6px; font-size: 15px; }
        textarea { min-height: 100px; resize: vertical; }
        .historico { background: #f0f4ff; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid var(--pedagogica); display: none; }
        .historico.visivel { display: block; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primario { background: #10b981; color: white; width: 100%; margin-top: 10px; }
        .btn-primario:hover { background: #059669; }
        .filtros { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .lista { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
        .item { padding: 14px; border-bottom: 1px solid var(--cinza); cursor: pointer; transition: background 0.15s; }
        .item:hover { background: #f9fafb; }
        .item .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; color: white; font-size: 13px; font-weight: 600; margin-left: 8px; }
        .tag.pedagogica { background: var(--pedagogica); }
        .tag.disciplinar { background: var(--disciplinar); }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .modal.aberto { display: flex; }
        .modal-conteudo { background: white; padding: 30px; border-radius: 12px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .botoes-modal { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn-imprimir { background: #3b82f6; color: white; }
        .btn-fechar { background: #6b7280; color: white; }
        .assinaturas { display: flex; justify-content: space-between; margin-top: 40px; flex-wrap: wrap; gap: 20px; }
        .campo-assinatura { border-top: 1px solid black; width: 180px; text-align: center; padding-top: 80px; }
        .alerta { padding: 12px; border-radius: 6px; margin: 12px 0; display: none; }
        .alerta.sucesso { background: #d1fae5; color: #065f46; display: block; }
        .alerta.erro { background: #fee2e2; color: #991b1b; display: block; }
        @media print {
            body { background: white; padding: 0; }
            .tabs, .form-container, .filtros, .lista, .botoes-modal, header { display: none !important; }
            .modal { position: static; background: white; }
            .modal-conteudo { box-shadow: none; max-height: none; }
            .sem-imprimir { display: none !important; }
        }
    </style>
</head>
<body>

<header>
    <h1>📋 Sistema de Ocorrências Escolares</h1>
    <p>Registro e gestão de ocorrências pedagógicas e disciplinares</p>
</header>

<!-- ABAS -->
<div class="tabs">
    <div class="tab active" id="abaRegistro" onclick="mostrarAba('registro')">📝 Registro</div>
    <div class="tab" id="abaGestao" onclick="mostrarAba('gestao')">🔍 Gestão e Consulta</div>
</div>

<!-- ABA REGISTRO -->
<div id="pagRegistro">
    <div class="form-container">
        <h3>Selecione o tipo de ocorrência</h3>
        <div class="tipo-botoes">
            <button class="tipo-btn pedagogica" id="btnPed" onclick="selecionarTipo('pedagogica')">📘 Pedagógica</button>
            <button class="tipo-btn disciplinar" id="btnDis" onclick="selecionarTipo('disciplinar')">⚠️ Disciplinar</button>
        </div>

        <div class="grupo">
            <label>Nome do Aluno</label>
            <input type="text" id="alunoNome" onInput="buscarHistorico(this.value)" placeholder="Digite o nome completo do aluno...">
        </div>

        <div class="historico" id="caixaHistorico">
            <strong>📊 Histórico do Aluno:</strong><br>
            Total: <span id="histTotal">0</span> ocorrências<br>
            Pedagógicas: <span id="histPed">0</span> | Disciplinares: <span id="histDis">0</span>
        </div>

        <div class="grupo">
            <label>Série e Turma</label>
            <input type="text" id="alunoSerie" placeholder="Ex: 6º ano C">
        </div>

        <div class="grupo">
            <label>Tipo da Ocorrência</label>
            <input type="text" id="ocorrenciaTipo" placeholder="Ex: Atraso repetido / Dificuldade de aprendizagem">
        </div>

        <div class="grupo">
            <label>Descrição Detalhada</label>
            <textarea id="descricao" placeholder="Descreva com detalhes a situação..."></textarea>
        </div>

        <div class="grupo">
            <label>Nome do Professor Responsável</label>
            <input type="text" id="professorNome" placeholder="Seu nome completo">
        </div>

        <div class="grupo">
            <label>Disciplina</label>
            <input type="text" id="disciplina" placeholder="Ex: Português / Matemática">
        </div>

        <div class="alerta" id="alertaMsg"></div>

        <button class="btn btn-primario" onclick="enviarOcorrencia()">📤 Enviar Ocorrência</button>
    </div>
</div>

<!-- ABA GESTÃO -->
<div id="pagGestao" style="display: none;">
    <div class="filtros">
        <div>
            <label>Nome do Aluno</label>
            <input type="text" id="filtroNome" placeholder="Filtrar por nome...">
        </div>
        <div>
            <label>Série/Turma</label>
            <input type="text" id="filtroSerie" placeholder="Filtrar por série...">
        </div>
        <div>
            <label>Tipo</label>
            <select id="filtroTipo">
                <option value="">Todos</option>
                <option value="pedagogica">Pedagógica</option>
                <option value="disciplinar">Disciplinar</option>
            </select>
        </div>
        <div>
            <label>Data Início</label>
            <input type="date" id="filtroDataIni">
        </div>
        <div>
            <label>Data Fim</label>
            <input type="date" id="filtroDataFim">
        </div>
        <button class="btn" style="align-self: flex-end; background:#4f46e5; color:white;" onclick="aplicarFiltros()">🔍 Filtrar</button>
    </div>

    <div class="lista" id="listaOcorrencias">
        <div style="padding:20px; text-align:center; color:#6b7280;">Carregando ocorrências...</div>
    </div>
</div>

<!-- MODAL DE VISUALIZAÇÃO -->
<div class="modal" id="modalVisualizar">
    <div class="modal-conteudo" id="conteudoImpressao">
        <!-- Conteúdo preenchido por JS -->
    </div>
</div>

<script>
// ==========================================================
// 👇 CONFIGURAÇÕES DO SUPABASE — COLOQUE SUAS DADOS ABAIXO
// ==========================================================
const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
const SUPABASE_KEY = "SUA-CHAVE-PUBLICA-AQUI";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Variáveis de controle
let tipoSelecionado = null;
let todasOcorrencias = [];

// ==========================================================
// FUNÇÕES DA ABA DE REGISTRO
// ==========================================================
function selecionarTipo(tipo) {
    tipoSelecionado = tipo;
    document.getElementById('btnPed').classList.remove('active');
    document.getElementById('btnDis').classList.remove('active');
    if (tipo === 'pedagogica') document.getElementById('btnPed').classList.add('active');
    else document.getElementById('btnDis').classList.add('active');
}

async function buscarHistorico(nome) {
    const caixa = document.getElementById('caixaHistorico');
    if (nome.trim().length < 3) { caixa.classList.remove('visivel'); return; }

    const { data, error } = await supabase
        .from('ocorrencias')
        .select('tipo')
        .ilike('aluno_nome', '%' + nome + '%');

    if (error) return;
    caixa.classList.add('visivel');
    let total = data.length, ped = 0, dis = 0;
    data.forEach(o => o.tipo === 'pedagogica' ? ped++ : dis++);
    document.getElementById('histTotal').textContent = total;
    document.getElementById('histPed').textContent = ped;
    document.getElementById('histDis').textContent = dis;
}

async function enviarOcorrencia() {
    const alerta = document.getElementById('alertaMsg');
    if (!tipoSelecionado) { alerta.className = 'alerta erro'; alerta.textContent = '⚠️ Selecione o tipo de ocorrência!'; return; }

    const dados = {
        tipo: tipoSelecionado,
        aluno_nome: document.getElementById('alunoNome').value.trim(),
        aluno_serie: document.getElementById('alunoSerie').value.trim(),
        ocorrencia_tipo: document.getElementById('ocorrenciaTipo').value.trim(),
        descricao: document.getElementById('descricao').value.trim(),
        professor_nome: document.getElementById('professorNome').value.trim(),
        disciplina: document.getElementById('disciplina').value.trim(),
        solucao: '',
        assinaturas: ''
    };

    if (!dados.aluno_nome || !dados.descricao) {
        alerta.className = 'alerta erro';
        alerta.textContent = '⚠️ Preencha o nome do aluno e a descrição!';
        return;
    }

    const { error } = await supabase.from('ocorrencias').insert([dados]);
    if (error) {
        alerta.className = 'alerta erro';
        alerta.textContent = '❌ Erro ao salvar: ' + error.message;
    } else {
        alerta.className = 'alerta sucesso';
        alerta.textContent = '✅ Ocorrência registrada com sucesso!';
        // Limpar formulário
        document.getElementById('alunoNome').value = '';
        document.getElementById('alunoSerie').value = '';
        document.getElementById('ocorrenciaTipo').value = '';
        document.getElementById('descricao').value = '';
        document.getElementById('professorNome').value = '';
        document.getElementById('disciplina').value = '';
        document.getElementById('caixaHistorico').classList.remove('visivel');
        document.getElementById('btnPed').classList.remove('active');
        document.getElementById('btnDis').classList.remove('active');
        tipoSelecionado = null;
        carregarLista();
    }
}

// ==========================================================
// FUNÇÕES DA ABA DE GESTÃO
// ==========================================================
function mostrarAba(nome) {
    document.getElementById('pagRegistro').style.display = nome === 'registro' ? 'block' : 'none';
    document.getElementById('pagGestao').style.display = nome === 'gestao' ? 'block' : 'none';
    document.getElementById('abaRegistro').classList.toggle('active', nome === 'registro');
    document.getElementById('abaGestao').classList.toggle('active', nome === 'gestao');
    if (nome === 'gestao') carregarLista();
}

async function carregarLista(filtros = {}) {
    let query = supabase.from('ocorrencias').select('*').order('created_at', { ascending: false });

    if (filtros.nome) query = query.ilike('aluno_nome', '%' + filtros.nome + '%');
    if (filtros.serie) query = query.ilike('aluno_serie', '%' + filtros.serie + '%');
    if (filtros.tipo) query = query.eq('tipo', filtros.tipo);
    if (filtros.dataIni) query = query.gte('created_at', filtros.dataIni + 'T00:00:00');
    if (filtros.dataFim) query = query.lte('created_at', filtros.dataFim + 'T23:59:59');

    const { data, error } = await query;
    const lista = document.getElementById('listaOcorrencias');

    if (error || !data.length) {
        lista.innerHTML = '<div style="padding:30px; text-align:center; color:#6b7280;">Nenhuma ocorrência encontrada.</div>';
        return;
    }

    todasOcorrencias = data;
    lista.innerHTML = data.map(o => {
        const dataBr = new Date(o.created_at).toLocaleDateString('pt-BR');
        const tagClass = o.tipo === 'pedagogica' ? 'pedagogica' : 'disciplinar';
        const tagTexto = o.tipo === 'pedagogica' ? 'Pedagógica' : 'Disciplinar';
        return `
            <div class="item" onclick="abrirVisualizacao('${o.id}')">
                <strong>${dataBr}</strong> — ${o.aluno_nome} (${o.aluno_serie})
                <span class="tag ${tagClass}">${tagTexto}</span><br>
                <small>${o.ocorrencia_tipo || 'Sem tipo'} — ${o.professor_nome || 'Professor não informado'}</small>
            </div>
        `;
    }).join('');
}

function aplicarFiltros() {
    carregarLista({
        nome: document.getElementById('filtroNome').value.trim(),
        serie: document.getElementById('filtroSerie').value.trim(),
        tipo: document.getElementById('filtroTipo').value,
        dataIni: document.getElementById('filtroDataIni').value,
        dataFim: document.getElementById('filtroDataFim').value
    });
}

async function abrirVisualizacao(id) {
    const ocorrencia = todasOcorrencias.find(o => o.id === id);
    if (!ocorrencia) return;

    // Buscar histórico do aluno
    const { data: historico } = await supabase
        .from('ocorrencias').select('tipo').ilike('aluno_nome', '%' + ocorrencia.aluno_nome + '%');

    let total = historico.length, ped = 0, dis = 0;
    historico.forEach(h => h.tipo === 'pedagogica' ? ped++ : dis++);

    const dataBr = new Date(ocorrencia.created_at).toLocaleDateString('pt-BR');
    const tagTexto = ocorrencia.tipo === 'pedagogica' ? '📘 Pedagógica' : '⚠️ Disciplinar';

    document.getElementById('conteudoImpressao').innerHTML = `
        <h2 style="text-align:center; margin-bottom:25px;">REGISTRO DE OCORRÊNCIA ESCOLAR</h2>
        <p><strong>Data:</strong> ${dataBr}</p>
        <p><strong>Tipo:</strong> ${tagTexto}</p>
        <p><strong>Nome do Aluno:</strong> ${ocorrencia.aluno_nome}</p>
        <p><strong>Série/Turma:</strong> ${ocorrencia.aluno_serie}</p>
        <p><strong>Histórico do aluno:</strong> Total: ${total} | Pedagógicas: ${ped} | Disciplinares: ${dis}</p>
        <p><strong>Tipo da Ocorrência:</strong> ${ocorrencia.ocorrencia_tipo || 'Não informado'}</p>
        <p><strong>Descrição:</strong></p>
        <p style="white-space: pre-wrap; background:#f9fafb; padding:12px; border-radius:6px;">${ocorrencia.descricao}</p>
        <p><strong>Professor Responsável:</strong> ${ocorrencia.professor_nome}</p>
        <p><strong>Disciplina:</strong> ${ocorrencia.disciplina || 'Não informada'}</p>
        <hr style="margin:20px 0; border:1px dashed #ccc;">
        <p><strong>✍️ Providência / Solução:</strong></p>
        <textarea id="campoSolucao" style="width:100%; height:100px; padding:10px; border:1px solid #ccc; border-radius:6px;">${ocorrencia.solucao || ''}</textarea>
        <p><strong>🖋️ Assinaturas:</strong></p>
        <textarea id="campoAssinaturas" style="width:100%; height:80px; padding:10px; border:1px solid #ccc; border-radius:6px;" placeholder="Professor, Coordenador, Responsável...">${ocorrencia.assinaturas || ''}</textarea>
        <div class="assinaturas">
            <div class="campo-assinatura">Professor</div>
            <div class="campo-assinatura">Coordenador(a)</div>
            <div class="campo-assinatura">Responsável</div>
        </div>
        <div class="botoes-modal sem-imprimir">
            <button class="btn" style="background:#10b981; color:white;" onclick="salvarSolucao('${id}')">💾 Salvar Solução e Assinaturas</button>
            <button class="btn btn-imprimir" onclick="imprimir()">🖨️ Imprimir</button>
            <button class="btn btn-fechar" onclick="fecharModal()">Fechar</button>
        </div>
    `;

    document.getElementById('modalVisualizar').classList.add('aberto');
}

async function salvarSolucao(id) {
    const solucao = document.getElementById('campoSolucao').value;
    const assinaturas = document.getElementById('campoAssinaturas').value;

    const { error } = await supabase
        .from('ocorrencias')
        .update({ solucao: solucao, assinaturas: assinaturas })
        .eq('id', id);

    if (error) alert('❌ Erro ao salvar: ' + error.message);
    else alert('✅ Salvo com sucesso!');
}

function imprimir() {
    window.print();
}

function fecharModal() {
    document.getElementById('modalVisualizar').classList.remove('aberto');
}

// Fechar modal clicando fora
document.getElementById('modalVisualizar').addEventListener('click', e => {
    if (e.target.id === 'modalVisualizar') fecharModal();
});

</script>
</body>
</html>
