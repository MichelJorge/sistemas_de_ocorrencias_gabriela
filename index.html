<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ocorrências Escolares</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{--bg:#0b0b0f;--card:rgba(18,18,26,.78);--border:rgba(255,255,255,.12);--primary:#8b5cf6;--hover:#7c3aed;--text:#f3f4f6;--muted:#9ca3af;--blue:#3b82f6;--orange:#f97316}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
        body{background:var(--bg);background-image:radial-gradient(circle at 15% 20%,rgba(139,92,246,.15),transparent 40%),radial-gradient(circle at 85% 80%,rgba(59,130,246,.1),transparent 40%);color:var(--text);padding:30px 20px;max-width:1200px;margin:auto;min-height:100vh}
        header{text-align:center;margin-bottom:40px} h1{margin-bottom:8px;font-size:2.2rem} header p{color:var(--muted);font-size:1.05rem}
        .tabs{display:flex;gap:12px;margin-bottom:25px;border-bottom:1px solid var(--border)} .tab{padding:12px 24px;cursor:pointer;border-radius:8px 8px 0 0;font-weight:600;color:var(--muted)} .tab.active{background:var(--card);border:1px solid var(--border);border-bottom-color:var(--bg);color:var(--text)}
        .box,.modal-content{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--border);padding:30px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.4);margin-bottom:25px} h3{font-size:1.2rem;margin-bottom:16px}
        .type-buttons{display:flex;gap:15px;margin-bottom:20px}.type-btn{flex:1;padding:14px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02);cursor:pointer;font-size:15px;font-weight:600;color:var(--muted)}.type-btn.pedagogica.active{background:rgba(59,130,246,.2);border-color:var(--blue);color:#93c5fd}.type-btn.disciplinar.active{background:rgba(249,115,22,.2);border-color:var(--orange);color:#fdba74}
        .group{margin-bottom:18px}label{display:block;margin-bottom:6px;font-weight:500;font-size:.9rem;color:var(--muted)}input,textarea,select{width:100%;padding:12px 16px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;font-size:15px;color:var(--text)}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}textarea{min-height:100px;resize:vertical}
        .history{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);padding:15px;border-radius:8px;margin:15px 0;display:none;color:#93c5fd;font-size:.95rem}.history.visible{display:block}
        .btn{padding:12px 24px;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.primary{background:var(--primary);color:white;width:100%;margin-top:10px}.primary:hover{background:var(--hover)}
        .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;align-items:end}.list{overflow:hidden;padding:0}.item{padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer}.item:hover{background:rgba(255,255,255,.03)}.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;margin-left:8px}.tag.pedagogica{background:rgba(59,130,246,.2);color:#93c5fd}.tag.disciplinar{background:rgba(249,115,22,.2);color:#fdba74}.item small{color:var(--muted)}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}.modal.open{display:flex}.modal-content{max-width:700px;width:100%;max-height:90vh;overflow-y:auto;background:#121218}.modal-buttons{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.signatures{display:flex;justify-content:space-between;margin-top:40px;flex-wrap:wrap;gap:20px}.signature{border-top:1px solid var(--muted);width:180px;text-align:center;padding-top:10px;color:var(--muted);font-size:.9rem}
        .alert{padding:12px;border-radius:8px;margin:12px 0;display:none;font-size:.95rem;line-height:1.5}.alert.success{display:block;background:rgba(16,185,129,.15);color:#34d399}.alert.error{display:block;background:rgba(239,68,68,.15);color:#f87171}.alert.warning{display:block;background:rgba(234,179,8,.15);color:#fbbf24}
        #diagnostic{display:none;background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.4);color:#fbbf24;padding:14px 18px;border-radius:10px;margin-bottom:20px;font-size:.9rem;line-height:1.5}#diagnostic strong{color:#fde68a}
        @media print{body{background:#fff;color:#000;padding:0}.tabs,.form,.filters,.list,.modal-buttons,header,#diagnostic{display:none!important}.modal{position:static;background:#fff}.modal-content{background:#fff;color:#000;border:0;box-shadow:none;max-height:none}.signature{border-color:#000;color:#000}.no-print{display:none!important}}
    </style>
</head>
<body>
<div id="diagnostic"></div>
<header><h1>📋 Sistema de Ocorrências Escolares</h1><p>Registro e gestão de ocorrências pedagógicas e disciplinares</p></header>
<div class="tabs"><div class="tab active" id="tabRegister" onclick="showTab('register')">📝 Registro</div><div class="tab" id="tabManage" onclick="showTab('manage')">🔍 Gestão e Consulta</div></div>

<section id="pageRegister">
<div class="box form"><h3>Selecione o tipo de ocorrência</h3>
<div class="type-buttons"><button class="type-btn pedagogica" id="btnPed" onclick="selectType('pedagogica')">📘 Pedagógica</button><button class="type-btn disciplinar" id="btnDis" onclick="selectType('disciplinar')">⚠️ Disciplinar</button></div>
<div class="group"><label for="studentName">Nome do Aluno</label><input id="studentName" type="text" oninput="searchHistoryDebounced(this.value)" placeholder="Digite o nome completo do aluno..."></div>
<div class="history" id="history"><strong>📊 Histórico do Aluno:</strong><br>Total: <span id="historyTotal">0</span> ocorrências<br>Pedagógicas: <span id="historyPed">0</span> | Disciplinares: <span id="historyDis">0</span></div>
<div class="group"><label for="studentClass">Série e Turma</label><input id="studentClass" type="text" placeholder="Ex: 6º ano C"></div>
<div class="group"><label for="occurrenceType">Tipo da Ocorrência</label><input id="occurrenceType" type="text" placeholder="Ex: Atraso repetido / Dificuldade de aprendizagem"></div>
<div class="group"><label for="description">Descrição Detalhada</label><textarea id="description" placeholder="Descreva com detalhes a situação..."></textarea></div>
<div class="group"><label for="teacherName">Nome do Professor Responsável</label><input id="teacherName" type="text" placeholder="Seu nome completo"></div>
<div class="group"><label for="subject">Disciplina</label><input id="subject" type="text" placeholder="Ex: Português / Matemática"></div>
<div class="alert" id="formAlert"></div><button class="btn primary" id="sendButton" onclick="sendOccurrence()">📤 Enviar Ocorrência</button>
</div></section>

<section id="pageManage" style="display:none"><div class="box filters">
<div><label for="filterName">Nome do Aluno</label><input id="filterName" placeholder="Filtrar por nome..."></div><div><label for="filterClass">Série/Turma</label><input id="filterClass" placeholder="Filtrar por série..."></div><div><label for="filterType">Tipo</label><select id="filterType"><option value="">Todos</option><option value="pedagogica">Pedagógica</option><option value="disciplinar">Disciplinar</option></select></div><div><label for="filterStart">Data Início</label><input id="filterStart" type="date"></div><div><label for="filterEnd">Data Fim</label><input id="filterEnd" type="date"></div><button class="btn" style="background:var(--primary);color:#fff;height:46px" onclick="applyFilters()">🔍 Filtrar</button>
</div><div class="box list" id="occurrenceList"><div style="padding:20px;text-align:center;color:var(--muted)">Carregando ocorrências...</div></div></section>

<div class="modal" id="viewModal"><div class="modal-content" id="printContent"></div></div>
<script>
// ATENÇÃO: Se necessário, certifique-se de usar a chave anon tradicional do projeto caso o formato novo gere restrições de CORS/DNS no browser.
const SUPABASE_URL = 'https://jewhksbhobegdqtotyzn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impld2hrc2Job2JlZ2RxdG90eXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTg4OTQsImV4cCI6MjEwNDYzNDg5NH0.6VgVvNL2yb9tGmwRsBxdsnK1C3zMvjBjJ2B3xamW3OU';

let db = null;
let selectedType = null;
let allOccurrences = [];
let historyTimer = null;

const $ = id => document.getElementById(id);
function escapeHTML(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function showDiagnostic(html) { $('diagnostic').innerHTML = html; $('diagnostic').style.display = 'block'; }
function showAlert(type, text) { const el = $('formAlert'); el.className = 'alert ' + type; el.textContent = text; el.style.display = 'block'; }

async function checkConnection() {
    if (location.protocol === 'file:') {
        showDiagnostic('<strong>Abra este arquivo por um servidor web.</strong>');
        return;
    }
    if (!navigator.onLine) { 
        showDiagnostic('<strong>O dispositivo está sem conexão com a internet.</strong>'); 
        return; 
    }
    try {
        const { error } = await db.from('ocorrencias').select('id').limit(1);
        if (error) throw error;
    } catch (error) {
        showDiagnostic('<strong>Erro de conexão com o Supabase.</strong> Verifique se a chave de API está correta e se a tabela <code>ocorrencias</code> existe no banco.<br>Detalhe: ' + escapeHTML(error.message));
    }
}

function selectType(type) { selectedType = type; $('btnPed').classList.toggle('active', type === 'pedagogica'); $('btnDis').classList.toggle('active', type === 'disciplinar'); }
function searchHistoryDebounced(name) { clearTimeout(historyTimer); historyTimer = setTimeout(() => searchHistory(name), 450); }
async function searchHistory(name) {
    const box = $('history');
    if (!db || name.trim().length < 3) { box.classList.remove('visible'); return; }
    try {
        const { data, error } = await db.from('ocorrencias').select('tipo').ilike('aluno_nome', '%' + name.trim() + '%');
        if (error) throw error;
        let ped = 0, dis = 0; (data || []).forEach(item => item.tipo === 'pedagogica' ? ped++ : dis++);
        $('historyTotal').textContent = (data || []).length; $('historyPed').textContent = ped; $('historyDis').textContent = dis; box.classList.add('visible');
    } catch (error) { console.error('Erro no histórico:', error); }
}

async function sendOccurrence() {
    if (!db) return showAlert('error', 'Conexão com o Supabase indisponível.');
    if (!selectedType) return showAlert('error', 'Selecione o tipo de ocorrência.');
    const record = { tipo:selectedType, aluno_nome:$('studentName').value.trim(), aluno_serie:$('studentClass').value.trim(), ocorrencia_tipo:$('occurrenceType').value.trim(), descricao:$('description').value.trim(), professor_nome:$('teacherName').value.trim(), disciplina:$('subject').value.trim(), solucao:'', assinaturas:'' };
    if (!record.aluno_nome || !record.aluno_serie || !record.descricao || !record.professor_nome) return showAlert('error', 'Preencha Nome, Série, Descrição e Professor.');
    const button = $('sendButton'); button.disabled = true; button.textContent = 'Enviando...';
    try {
        const { error } = await db.from('ocorrencias').insert(record);
        if (error) throw error;
        showAlert('success', '✅ Ocorrência registrada com sucesso!');
        ['studentName','studentClass','occurrenceType','description','teacherName','subject'].forEach(id => $(id).value = ''); $('history').classList.remove('visible'); selectedType = null; selectType(''); await loadOccurrences();
    } catch (error) { console.error(error); showAlert('error', 'Erro ao salvar: ' + error.message); }
    finally { button.disabled = false; button.textContent = '📤 Enviar Ocorrência'; }
}

function showTab(tab) { const register = tab === 'register'; $('pageRegister').style.display = register ? 'block' : 'none'; $('pageManage').style.display = register ? 'none' : 'block'; $('tabRegister').classList.toggle('active', register); $('tabManage').classList.toggle('active', !register); if (!register) loadOccurrences(); }
async function loadOccurrences(filters = {}) {
    if (!db) return;
    let query = db.from('ocorrencias').select('*').order('created_at', { ascending:false });
    if (filters.name) query = query.ilike('aluno_nome', '%' + filters.name + '%'); if (filters.className) query = query.ilike('aluno_serie', '%' + filters.className + '%'); if (filters.type) query = query.eq('tipo', filters.type); if (filters.start) query = query.gte('created_at', filters.start + 'T00:00:00'); if (filters.end) query = query.lt('created_at', filters.end + 'T23:59:59.999');
    const list = $('occurrenceList');
    try {
        const { data, error } = await query; if (error) throw error; allOccurrences = data || [];
        if (!allOccurrences.length) { list.innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted)">Nenhuma ocorrência encontrada.</div>'; return; }
        list.innerHTML = allOccurrences.map(item => { const date = new Date(item.created_at).toLocaleDateString('pt-BR'); const type = item.tipo === 'pedagogica' ? 'Pedagógica' : 'Disciplinar'; return '<div class="item" data-id="' + escapeHTML(item.id) + '"><strong>' + date + '</strong> — ' + escapeHTML(item.aluno_nome) + ' (' + escapeHTML(item.aluno_serie) + ') <span class="tag ' + item.tipo + '">' + type + '</span><br><small>' + escapeHTML(item.ocorrencia_tipo || 'Sem tipo') + ' — ' + escapeHTML(item.professor_nome || 'Professor não informado') + '</small></div>'; }).join('');
        list.querySelectorAll('.item').forEach(item => item.addEventListener('click', () => openView(item.dataset.id)));
    } catch (error) { list.innerHTML = '<div style="padding:30px;text-align:center;color:#f87171">Erro ao carregar: ' + escapeHTML(error.message) + '</div>'; }
}
function applyFilters() { loadOccurrences({ name:$('filterName').value.trim(), className:$('filterClass').value.trim(), type:$('filterType').value, start:$('filterStart').value, end:$('filterEnd').value }); }

async function openView(id) {
    const occurrence = allOccurrences.find(item => String(item.id) === String(id)); if (!occurrence || !db) return;
    let history = []; try { const result = await db.from('ocorrencias').select('tipo').ilike('aluno_nome', '%' + occurrence.aluno_nome + '%'); history = result.data || []; } catch (error) { console.error(error); }
    const ped = history.filter(item => item.tipo === 'pedagogica').length, dis = history.filter(item => item.tipo === 'disciplinar').length;
    $('printContent').innerHTML = '<h2 style="text-align:center;margin-bottom:25px">REGISTRO DE OCORRÊNCIA ESCOLAR</h2><p><strong>Data:</strong> ' + new Date(occurrence.created_at).toLocaleDateString('pt-BR') + '</p><p><strong>Tipo:</strong> ' + (occurrence.tipo === 'pedagogica' ? '📘 Pedagógica' : '⚠️ Disciplinar') + '</p><p><strong>Nome do Aluno:</strong> ' + escapeHTML(occurrence.aluno_nome) + '</p><p><strong>Série/Turma:</strong> ' + escapeHTML(occurrence.aluno_serie) + '</p><p><strong>Histórico:</strong> Total: ' + history.length + ' | Pedagógicas: ' + ped + ' | Disciplinares: ' + dis + '</p><p><strong>Tipo da Ocorrência:</strong> ' + escapeHTML(occurrence.ocorrencia_tipo || 'Não informado') + '</p><p style="margin-top:10px"><strong>Descrição:</strong></p><p style="white-space:pre-wrap;background:rgba(0,0,0,.2);padding:12px;border-radius:8px;margin-top:5px">' + escapeHTML(occurrence.descricao) + '</p><p style="margin-top:10px"><strong>Professor:</strong> ' + escapeHTML(occurrence.professor_nome) + '</p><p><strong>Disciplina:</strong> ' + escapeHTML(occurrence.disciplina || 'Não informada') + '</p><hr style="margin:20px 0"><p><strong>✍️ Providência / Solução:</strong></p><textarea id="solution" style="margin-top:5px">' + escapeHTML(occurrence.solucao) + '</textarea><p style="margin-top:10px"><strong>🖋️ Observações / Assinaturas:</strong></p><textarea id="signatures" style="height:80px;margin-top:5px">' + escapeHTML(occurrence.assinaturas) + '</textarea><div class="signatures"><div class="signature">Professor</div><div class="signature">Coordenador(a)</div><div class="signature">Responsável</div></div><div class="modal-buttons no-print"><button class="btn" style="background:#10b981;color:#fff" id="saveButton">💾 Salvar</button><button class="btn" style="background:#3b82f6;color:#fff" onclick="window.print()">🖨️ Imprimir</button><button class="btn" style="background:#374151;color:#fff" onclick="closeModal()">Fechar</button></div>';
    $('saveButton').addEventListener('click', () => saveSolution(occurrence.id)); $('viewModal').classList.add('open');
}
async function saveSolution(id) { try { const { error } = await db.from('ocorrencias').update({ solucao:$('solution').value, assinaturas:$('signatures').value }).eq('id', id); if (error) throw error; alert('✅ Salvo com sucesso!'); } catch (error) { alert('❌ Erro ao salvar: ' + error.message); } }
function closeModal() { $('viewModal').classList.remove('open'); }
$('viewModal').addEventListener('click', event => { if (event.target.id === 'viewModal') closeModal(); });

(function init() {
    try { 
        if (!window.supabase || typeof window.supabase.createClient !== 'function') throw new Error('Biblioteca do Supabase não carregada.'); 
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 
    } catch (error) { 
        showDiagnostic('<strong>Erro ao carregar o Supabase:</strong> ' + escapeHTML(error.message)); 
    }
    checkConnection();
})();
</script>
</body>
</html>
